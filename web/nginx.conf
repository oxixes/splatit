server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The panel reads config.json at run time, which is what lets one build point
    # at a different management API. Caching it would defeat that.
    location = /config.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed asset filenames change whenever the contents change, so they are
    # safe to cache for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client side routing: /players and friends are application routes rather
    # than files on disk, so anything unmatched falls back to the entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
